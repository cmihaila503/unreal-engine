# Copy to .github/workflows/rule-tests.yml in the project repo (keep Handoff/ committed: it's small, text only).
# Runs every pure rule test on each push and PR, on a plain Linux runner — no Unreal needed, ~30 s.
name: Rule tests
on:
  push:
  pull_request:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false        # the rule tests are text; don't pull the Git LFS content
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pure rule tests (g++, -Werror)
        run: python Handoff/Automation/Tools/run_rule_tests.py Handoff
      - name: Localization lint
        run: python Handoff/Localization/Tools/loc_lint.py Source/Murdar_GameDev --strict
